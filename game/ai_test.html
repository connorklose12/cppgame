<!doctype html>
<title>AI Dialogue Test</title>
<style>
  body { font: 16px sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; }
  #out { white-space: pre-wrap; background: #f0f0f0; padding: 16px; border-radius: 8px; min-height: 60px; }
  button { font-size: 16px; padding: 8px 16px; }
</style>
<body>
  <h2>AI Dialogue Test (DistilGPT2 via transformers.js)</h2>
  <p>This checks that a small language model can run in your browser with zero servers or API keys.
     The first click downloads about 90-150MB (cached after that) and can take a minute on a slow connection.</p>
  <button id="go">Generate a line</button>
  <p id="status"></p>
  <div id="out"></div>

  <script type="module">
    const statusEl = document.getElementById('status');
    const outEl = document.getElementById('out');
    const btn = document.getElementById('go');
    let pipe = null;

    btn.onclick = async () => {
      btn.disabled = true;
      try {
        if (!pipe) {
          statusEl.textContent = 'Downloading model (first time only)...';
          const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
          env.allowLocalModels = false;
          pipe = await pipeline('text-generation', 'Xenova/distilgpt2');
        }
        statusEl.textContent = 'Generating...';
        const prompt = 'A friendly villager in a small colorful game world says to the player: "';
        const result = await pipe(prompt, { max_new_tokens: 18, temperature: 0.9, top_k: 40, repetition_penalty: 1.3 });
        const text = result[0].generated_text.slice(prompt.length).split('\n')[0].trim();
        outEl.textContent = text || '(empty - try again)';
        statusEl.textContent = 'Done. Click again for another line.';
      } catch (e) {
        statusEl.textContent = 'Error - see browser console (F12) for details.';
        console.error(e);
      }
      btn.disabled = false;
    };
  </script>
</body>
