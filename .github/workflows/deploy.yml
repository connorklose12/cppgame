name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the game files were committed
        run: |
          for f in game/main.cpp game/shell.html game/config.json game/dialogue.json game/jsonutil.h \
                   game/npc_brain.h game/npc_brain_weights.h game/social.h game/assets/sounds/music.wav; do
            test -f "$f" || { echo "MISSING from the repo: $f (did you git add it?)"; exit 1; }
          done

      - uses: mymindstorm/setup-emsdk@v14

      - name: Run unit tests
        working-directory: game
        run: |
          g++ -std=c++17 tests.cpp -o tests
          ./tests

      - name: Download raylib for the web
        run: |
          curl -sL -o raylib.zip https://github.com/raysan5/raylib/releases/download/5.5/raylib-5.5_webassembly.zip
          unzip -q raylib.zip
          rm -rf game/raylib
          mv raylib-5.5_webassembly game/raylib

      - name: Build the game
        working-directory: game
        run: |
          chmod +x build-web.sh
          ./build-web.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: MyProject/wwwroot

      - id: deployment
        uses: actions/deploy-pages@v4